{{- if and .Values.ingress.enabled .Values.web.enabled }}
{{- if .Values.ingress.auth.enabled }}
{{- $htpasswd := list }}
{{- /* there are two possibilities for the password, depending on ingress.auth.encrypted: */}}
{{- if .Values.ingress.auth.encrypted}}
{{- /* 1. pre-encrypted passwords, directly using them in the secret (format: username:password) */}}
{{-   range .Values.ingress.auth.users }}
{{-   $htpasswd = (printf "%s:%s" .username .password) | append $htpasswd }}
{{-   end }}

{{- else }}{{/* if not .Values.ingress.auth.encrypted */}}
{{- /* 2. plain text password, encoding it using htppasswd so that it can be used by nginx ingress */}}
{{-   range .Values.ingress.auth.users }}
{{-   $htpasswd = (htpasswd .username .password) | append $htpasswd }}
{{-   end }}{{/* range .Values.ingress.auth.users */}}
{{- end }}{{/* if .Values.ingress.auth.encrypted */}}

{{- if eq .Values.ingress.className "traefik" }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-auth
  namespace: {{ .Release.Namespace }}
  labels: {{- include "labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ .Release.Name }}-auth
    removeHeader: true
---
{{- end }}{{/* if eq .Values.ingress.classname "traefik" */}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  auth: {{ $htpasswd | join "\n" | b64enc }}
---
{{- end }}{{/* if .Values.ingress.auth.enabled */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "labels" . | nindent 4 }}
  {{- $annotations := .Values.ingress.annotations }}
  {{- if .Values.ingress.auth.enabled }}
    {{- if not (eq .Values.ingress.className "traefik") }}
      {{- $authAnnotations := dict "nginx.ingress.kubernetes.io/auth-type" "basic" "nginx.ingress.kubernetes.io/auth-secret" (printf "%s-auth" .Release.Name) "nginx.ingress.kubernetes.io/auth-realm" "Authentication Required" }}
      {{- $annotations = merge $authAnnotations $annotations }}
    {{- else }}{{/* not nginx, add traefik middleware */}}
      {{- $authAnnotations := dict "traefik.ingress.kubernetes.io/router.middlewares" (printf "%s-%s-auth@kubernetescrd" .Release.Namespace .Release.Name) }}
      {{- $annotations = merge $authAnnotations $annotations }}
    {{- end }}{{/* if not eq .Values.ingress.className "traefik" */}}
  {{- end }}{{/* if .Values.ingress.auth.enabled */}}
  {{- if gt (len $annotations) 0 }}
  annotations: {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hostnames }}
  - host: {{ . | quote }}
    http:
      paths:
      - backend:
          service:
            name: {{ $.Release.Name }}
            port:
              name: http
        pathType: Prefix
        path: /
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
  - hosts: {{ .Values.ingress.hostnames | toJson }}
    secretName: {{ .Release.Name }}-cert
  {{- end }}
{{- end }}{{/* if and .Values.ingress.enabled .Values.web.enabled */}}
