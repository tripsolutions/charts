{{- if .Values.beta_ui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agency.releaseName" . }}-beta
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agency.labels" . | nindent 4 }}
    app.kubernetes.io/component: beta-ui
spec:
  replicas: {{ .Values.replicas.beta_ui }}
  selector:
    matchLabels:
      {{- include "agency.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: beta-ui
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "agency.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: beta-ui
    spec:
      securityContext:
        fsGroup: 33
      containers:
      - name: admin
        image: {{ .Values.beta_ui.image }}
        imagePullPolicy: {{ .Values.beta_ui.imagePullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
        env:
        - name: NGINX_PORT
          value: 8080
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          {{- toYaml .Values.resources.beta_ui | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agency.releaseName" . }}-beta
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agency.labels" . | nindent 4 }}
    app.kubernetes.io/component: beta-ui
spec:
  selector:
    {{- include "agency.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: beta-ui
  ports:
  - protocol: TCP
    port: 80
    targetPort: http
    name: http
  type: ClusterIP
{{- end }}{{/* if .Values.beta_ui.enabled */}}